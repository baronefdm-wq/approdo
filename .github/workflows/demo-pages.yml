# Pubblica la versione dimostrativa statica su GitHub Pages.
# Si aggiorna a ogni modifica e ogni lunedì, così le date d'esempio restano nel futuro.
name: Demo su GitHub Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: node --no-warnings=ExperimentalWarning scripts/export-demo.mjs demo-site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo-site
      - id: deployment
        uses: actions/deploy-pages@v4
